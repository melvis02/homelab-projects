apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "69.1.0" # Use a recent stable version
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    prometheus:
      prometheusSpec:
        securityContext:
          runAsUser: 1000
          runAsGroup: 2000
          fsGroup: 2000
          runAsNonRoot: false # Allow initContainer to run as root
        initContainers:
          - name: fix-permissions
            image: busybox
            command: ["sh", "-c", "mkdir -p /prometheus/prometheus-db && chown -R 1000:2000 /prometheus/prometheus-db"]
            securityContext:
              runAsUser: 0
            volumeMounts:
              - name: prometheus-kube-prometheus-stack-prometheus-db
                mountPath: /prometheus
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi
    grafana:
      adminPassword: admin # User should change this
      grafana.ini:
        auth.anonymous:
          enabled: true
          org_role: Viewer
        auth.proxy:
          enabled: true
          header_name: Cf-Access-Authenticated-User-Email
          header_property: email
          auto_sign_up: true
        users:
          auto_assign_org_role: Admin
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
        hosts:
          - grafana.treympick.me
        path: /
        tls:
          - secretName: grafana-tls
            hosts:
              - grafana.treympick.me
      persistence:
        enabled: true
        storageClassName: local-path
        size: 5Gi
      additionalDataSources:
        - name: loki
          uid: cfbegvgiw28lcd
          type: loki
          url: http://loki-stack.monitoring.svc.cluster.local:3100
          access: proxy
          editable: true
          jsonData:
            version: "1"
          isDefault: false
    alertmanager:
      alertmanagerSpec:
        securityContext:
          runAsUser: 1000
          runAsGroup: 2000
          fsGroup: 2000
          runAsNonRoot: false
        initContainers:
          - name: fix-permissions
            image: busybox
            command: ["sh", "-c", "chown -R 1000:2000 /alertmanager"]
            securityContext:
              runAsUser: 0
            volumeMounts:
              - name: alertmanager-kube-prometheus-stack-alertmanager-db
                mountPath: /alertmanager
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 5Gi
