apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki-stack
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: loki-stack
      version: "2.10.2"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    createNamespace: true
  values:
    loki:
      enabled: true
      persistence:
        enabled: true
        size: 10Gi
    promtail:
      enabled: true
    grafana:
      enabled: false
      sidecar:
        datasources:
          enabled: false
    prometheus:
      enabled: false
