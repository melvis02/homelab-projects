apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: kube-system
spec:
  interval: 5m
  chart:
    spec:
      chart: headlamp
      version: "0.39.0"
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
      interval: 1h
  valuesFrom:
    - kind: Secret
      name: headlamp-oidc-values
  values:
    ingress:
      enabled: true
      annotations:
        traefik.ingress.kubernetes.io/router.middlewares: kube-system-headlamp-https-redirect@kubernetescrd
        cert-manager.io/cluster-issuer: letsencrypt-prod
      ingressClassName: traefik
      hosts:
        - host: headlamp.treympick.me
          paths:
            - path: /
              type: ImplementationSpecific
      tls:
        - secretName: headlamp-tls
          hosts:
            - headlamp.treympick.me
    persistentVolumeClaim:
      enabled: false
      accessModes:
        - ReadWriteOnce
      size: 1Gi
      storageClassName: local-path
    
    # Enable Flux plugin if available via values or if it needs to be configured
    # Checking docs, plugins might be separate or via config. 
    # For now deploying base and will check plugin config options. 
    # Usually headlamp detects kubeconfig. 
    
    # Headlamp configuration
    config:
      oidc:
        enabled: false
    
    # Plugin Configuration
    initContainers:
      - name: plugin-flux
        image: ghcr.io/headlamp-k8s/headlamp-plugin-flux:latest
        command:
          - /bin/sh
          - -c
          - mkdir -p /build/plugins && cp -r /plugins/* /build/plugins/
        volumeMounts:
          - name: headlamp-plugins
            mountPath: /build/plugins
    
    volumeMounts:
      - name: headlamp-plugins
        mountPath: /headlamp/plugins
        
    volumes:
      - name: headlamp-plugins
        emptyDir: {}
