apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 1h
  chart:
    spec:
      chart: metallb
      version: "0.14.9"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  targetNamespace: metallb-system
  values:
    controller:
      logLevel: info
      resources:
        requests:
          cpu: 20m
          memory: 50Mi
        limits:
          memory: 100Mi
    speaker:
      logLevel: info
      resources:
        requests:
          cpu: 20m
          memory: 50Mi
        limits:
          memory: 100Mi
      frr:
        resources:
          requests:
            cpu: 20m
            memory: 40Mi
          limits:
            memory: 100Mi
