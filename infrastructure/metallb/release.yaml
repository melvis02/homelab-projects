apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 1h
  chart:
    spec:
      chart: metallb
      version: "0.16.1"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  targetNamespace: metallb-system
  values:
    frrk8s:
      enabled: false
    controller:
      logLevel: info
      resources:
        requests:
          cpu: 20m
          memory: 50Mi
        limits:
          memory: 100Mi
    speaker:
      logLevel: info
      resources:
        requests:
          cpu: 20m
          memory: 50Mi
        limits:
          memory: 100Mi
      frr:
        enabled: false
