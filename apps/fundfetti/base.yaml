apiVersion: v1
kind: Namespace
metadata:
  name: fundfetti
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fundfetti
  namespace: fundfetti
  labels:
    app: fundfetti
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fundfetti
  template:
    metadata:
      labels:
        app: fundfetti
    spec:
      imagePullSecrets:
      - name: regcred
      containers:
      - name: fundfetti
        image: ghcr.io/melvis02/fundfetti:0.1.9 # {"$imagepolicy": "fundfetti:fundfetti"}
        imagePullPolicy: Always
        env:
        - name: DB_DRIVER
          value: "postgres"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: fundfetti-secret
              key: DATABASE_URL
        - name: SESSION_KEY
          valueFrom:
            secretKeyRef:
              name: fundfetti-secret
              key: SESSION_KEY
        - name: RESEND_API_KEY
          valueFrom:
            secretKeyRef:
              name: fundfetti-secret
              key: RESEND_API_KEY
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: fundfetti-secret
              key: GOOGLE_CLIENT_ID
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: fundfetti-secret
              key: GOOGLE_CLIENT_SECRET
        - name: APP_URL
          value: "https://fundfetti.org"
        - name: FROM_EMAIL
          value: "orders@fundfetti.org"
        ports:
        - containerPort: 8080 # Assumption, will verify
          name: http
---
apiVersion: v1
kind: Service
metadata:
  name: fundfetti
  namespace: fundfetti
spec:
  selector:
    app: fundfetti
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fundfetti
  namespace: fundfetti
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
  - host: fundfetti.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fundfetti
            port:
              number: 80
  tls:
  - hosts:
    - fundfetti.org
    secretName: fundfetti-tls
