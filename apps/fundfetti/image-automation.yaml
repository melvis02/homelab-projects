apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: fundfetti
  namespace: fundfetti
spec:
  image: ghcr.io/melvis02/fundfetti
  interval: 1m0s
  secretRef:
    name: regcred
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: fundfetti
  namespace: fundfetti
spec:
  imageRepositoryRef:
    name: fundfetti
  policy:
    semver:
      range: ">=0.0.1"
#      range: 1.0.x
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation
metadata:
  name: fundfetti
  namespace: fundfetti
spec:
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: 'Automated image update'
    push:
      branch: main
  update:
    path: ./apps/fundfetti
    strategy: Setters
