apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pi-hole
  namespace: pi-hole
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: pihole.treympick.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pi-hole-web
                port:
                  number: 80
  tls:
    - hosts:
        - pihole.treympick.me
      secretName: pihole-tls
