apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pi-hole
  namespace: pi-hole
spec:
  ingressClassName: traefik
  rules:
    - host: pihole.treympick.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pi-hole-web
                port:
                  number: 80
