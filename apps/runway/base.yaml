apiVersion: v1
kind: Namespace
metadata:
  name: runway
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: runway-data
  namespace: runway
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runway
  namespace: runway
  labels:
    app: runway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: runway
  template:
    metadata:
      labels:
        app: runway
    spec:
      imagePullSecrets:
      - name: regcred
      containers:
      - name: runway
        image: ghcr.io/melvis02/runway:0.1.0 # {"$imagepolicy": "runway:runway"}
        imagePullPolicy: Always
        env:
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8080"
        - name: DATABASE_PATH
          value: "/app/.data/finances.db"
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: data
          mountPath: /app/.data
        livenessProbe:
          httpGet:
            path: /api/summary
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/summary
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: runway-data
---
apiVersion: v1
kind: Service
metadata:
  name: runway
  namespace: runway
spec:
  selector:
    app: runway
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: runway
  namespace: runway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
  - host: runway.treympick.me
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: runway
            port:
              number: 80
  tls:
  - hosts:
    - runway.treympick.me
    secretName: runway-tls
