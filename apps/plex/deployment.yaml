apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
  namespace: plex
  labels:
    app: plex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      labels:
        app: plex
    spec:
      nodeSelector:
        hardware-type: intel-gpu
      containers:
      - name: plex
        image: plexinc/pms-docker:latest
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            gpu.intel.com/i915: 1
        ports:
        - containerPort: 32400
          name: http
        env:
        - name: TZ
          value: "America/Chicago"
        # The following claim token might be needed for first setup, uncomment and populate if necessary
        # - name: PLEX_CLAIM
        #   value: "claim-xxxx"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /data
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: plex-config
      - name: media
        persistentVolumeClaim:
          claimName: plex-media
