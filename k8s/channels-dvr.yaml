apiVersion: apps/v1
kind: Deployment
metadata:
  name: channels-dvr
  labels:
    app: channels-dvr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: channels-dvr
  template:
    metadata:
      labels:
        app: channels-dvr
    spec:
      nodeSelector:
        hardware-type: intel-gpu # Ensure it lands on the labeled GPU node
      containers:
      - name: channels-dvr
        image: fancybits/channels-dvr:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true # Often needed for hardware transcoding access even with plugin
        resources:
          limits:
            gpu.intel.com/i915: 1 # Request GPU via Device Plugin
        ports:
        - containerPort: 8089
          name: http
        env:
        - name: TZ
          value: "America/Chicago"
        volumeMounts:
        - name: config
          mountPath: /channels-dvr
        - name: recordings
          mountPath: /shares/DVR
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: channels-dvr-config
      - name: recordings
        persistentVolumeClaim:
          claimName: channels-dvr-recordings
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: channels-dvr-config
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: channels-dvr-recordings
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: channels-dvr
spec:
  type: LoadBalancer
  selector:
    app: channels-dvr
  ports:
  - port: 8089
    targetPort: 8089
    name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: channels-dvr
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
spec:
  rules:
  - host: dvr.treympick.me
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: channels-dvr
            port:
              number: 8089
  tls:
  - hosts:
    - dvr.treympick.me
    secretName: channels-dvr-tls
